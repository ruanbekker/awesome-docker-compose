version: '3.8'

services:
  maily:
    image: ghcr.io/stormsia/maily:latest
    container_name: maily
    restart: unless-stopped
    ports:
      - 8477:8477
    environment:
      - MAILY_HOST=0.0.0.0
      - MAILY_PORT=8477
      - MAILY_API_KEY=${MAILY_API_KEY:-your_secret_api_key}
      - MAILY_DATA_DIR=/data
    volumes:
      - maily-data:/data
    networks:
      - public

volumes:
  maily-data:
    driver: local

networks:
  public:
    name: public
