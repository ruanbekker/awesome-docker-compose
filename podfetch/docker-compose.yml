version: "3.9"

services:
  podfetch:
    image: samuel19982/podfetch:latest
    container_name: podfetch
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./podcasts:/app/podcasts
      - ./db:/app/db
    environment:
      - POLLING_INTERVAL=60
      - DATABASE_URL=sqlite:///app/db/podcast.db
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
